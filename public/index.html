<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05070c">
  <meta name="color-scheme" content="dark">
  <title>生日快乐</title>
  <meta name="description" content="一份生日礼物">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/cyber.css">
  <script src="/site.config.js"></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body class="is-locked">
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="scroll-progress" aria-hidden="true"><span></span></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- ============ 序：信号接入 ============ -->
  <div class="opening" id="opening" role="dialog" aria-modal="true" aria-labelledby="opening-to">
    <div class="opening__inner">
      <div class="signal" aria-hidden="true">
        <span class="signal__ring"></span><span class="signal__ring"></span><span class="signal__ring"></span>
        <span class="signal__core" data-c="recipient.sealLetter"></span>
      </div>
      <p class="opening__tag"><span class="opening__dot"></span>PRIVATE TRANSMISSION · 一条私人讯息</p>
      <p class="opening__to" id="opening-to" data-c="opening.to"></p>
      <p class="opening__line" data-c="opening.line"></p>
      <div class="opening__meter" aria-hidden="true"><i></i></div>
      <p class="opening__log" aria-hidden="true" data-opening-log></p>
      <div class="opening__actions">
        <button class="btn btn--primary" type="button" data-enter="sound"><span data-c="opening.enterWithSound"></span></button>
        <button class="btn btn--quiet" type="button" data-enter="quiet"><span data-c="opening.enterQuiet"></span></button>
      </div>
    </div>
  </div>

  <!-- 章节导航（桌面端） -->
  <nav class="rail" aria-label="章节" data-rail hidden></nav>

  <main id="main">
    <div class="dim" aria-hidden="true"></div>

    <!-- ============ 序幕 ============ -->
    <section class="hero" id="hero" data-act="hero" aria-labelledby="hero-name">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__image"></div>
        <div class="hero__glow hero__glow--a"></div>
        <div class="hero__glow hero__glow--b"></div>
        <div class="hero__glow hero__glow--c"></div>
      </div>
      <div class="hero__frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="hero__top"><span data-c="hero.dedication"></span><span class="hero__top-date" data-date></span></p>
      <div class="hero__content">
        <div class="hero__holo">
          <p class="hero__script script" data-c="hero.script"></p>
        </div>
        <div class="hero__sign">
          <h1 class="hero__name" id="hero-name" tabindex="-1" data-hero-name></h1>
        </div>
        <p class="hero__lead" data-c="hero.lead"></p>
        <p class="hero__count chip" data-countdown></p>
      </div>
      <a class="hero__scroll" href="#wishes"><span data-c="hero.scrollHint"></span><i aria-hidden="true"></i></a>
    </section>

    <!-- ============ 祝愿 ============ -->
    <section class="act wishes" id="wishes" data-act="wishes" aria-labelledby="wishes-title">
      <p class="act__mark" aria-hidden="true"><span data-act-no></span><b data-c="acts.wishes"></b></p>
      <div class="act__body">
        <header class="act__head" data-reveal>
          <h2 id="wishes-title" data-c="wishes.title"></h2>
          <p class="act__sub" data-c="wishes.subtitle"></p>
        </header>
        <ol class="wishlist" data-wishes></ol>
        <p class="wishes__quote" data-reveal data-c="wishes.quote"></p>
      </div>
    </section>

    <!-- ============ 烛光 ============ -->
    <section class="act cake" id="cake" data-act="cake" aria-labelledby="cake-title">
      <p class="act__mark" aria-hidden="true"><span data-act-no></span><b data-c="acts.cake"></b></p>
      <div class="act__body cake__layout">
        <div class="cake__stage" data-reveal>
          <div class="cake__light" aria-hidden="true"></div>
          <div class="cake__svg" data-cake-svg></div>
          <div class="cake__table" aria-hidden="true"></div>
          <p class="cake__wishfly" data-cake-wishfly aria-hidden="true"></p>
        </div>
        <div class="cake__side">
          <header class="act__head act__head--left" data-reveal>
            <h2 id="cake-title" data-c="cake.title"></h2>
            <p class="act__sub" data-c="cake.subtitle"></p>
          </header>
          <div class="cake__panel" data-cake-panel data-reveal>
            <ol class="cake__dots" aria-hidden="true"><li></li><li></li><li></li></ol>
            <p class="cake__step" data-cake-step aria-live="polite"></p>
            <div class="cake__wish" data-cake-wish hidden>
              <label class="sr-only" for="cake-wish-input">写下愿望（可选，不会保存）</label>
              <input id="cake-wish-input" type="text" maxlength="40" autocomplete="off" data-ph="cake.steps.wishPlaceholder">
              <p class="cake__wish-note" data-c="cake.steps.wishNote"></p>
            </div>
            <div class="cake__mic" data-cake-mic hidden><span class="cake__meter"><i></i></span></div>
            <div class="cake__actions">
              <button class="btn btn--primary" type="button" data-cake-primary></button>
              <button class="btn btn--ghost" type="button" data-cake-mic-btn hidden></button>
            </div>
            <p class="cake__hint" data-cake-hint></p>
          </div>
          <div class="cake__reveal" data-cake-reveal hidden tabindex="-1">
            <p class="script cake__reveal-mark" data-c="cake.reveal.mark"></p>
            <h3 data-c="cake.reveal.title"></h3>
            <p class="cake__reveal-text" data-c="cake.reveal.text"></p>
            <button class="cake__song" type="button" data-cake-song hidden>
              <span class="cake__song-eq" aria-hidden="true"><i></i><i></i><i></i></span>
              <span data-c="cake.reveal.songStop"></span>
            </button>
            <div class="cake__actions">
              <a class="btn btn--primary" href="#wall" data-cake-next><span data-c="cake.reveal.next"></span></a>
              <button class="btn btn--ghost" type="button" data-cake-again><span data-c="cake.reveal.again"></span></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 留言 ============ -->
    <section class="act wall" id="wall" data-act="wall" aria-labelledby="wall-title" data-feature="wishesWall">
      <p class="act__mark" aria-hidden="true"><span data-act-no></span><b data-c="acts.wall"></b></p>
      <div class="act__body">
        <header class="act__head" data-reveal>
          <h2 id="wall-title" data-c="wall.title"></h2>
          <p class="act__sub" data-c="wall.subtitle"></p>
        </header>
        <div class="wall__layout">
          <form class="wall__form paper" data-wall-form novalidate data-reveal>
            <h3 class="wall__form-title" data-c="wall.formTitle"></h3>
            <label class="pfield">
              <span class="pfield__label"><span data-c="wall.contentLabel"></span><em class="pfield__count" data-count>0 / 300</em></span>
              <textarea name="content" rows="5" maxlength="300" required data-ph="wall.contentPlaceholder"></textarea>
            </label>
            <label class="pfield pfield--inline">
              <span class="pfield__label" data-c="wall.nicknameLabel"></span>
              <input name="nickname" type="text" maxlength="20" autocomplete="nickname" required data-ph="wall.nicknamePlaceholder">
            </label>
            <label class="hp" aria-hidden="true">网站 <input name="website" type="text" tabindex="-1" autocomplete="off"></label>
            <p class="wall__notice" data-c="wall.notice"></p>
            <div class="wall__submit">
              <button class="btn btn--ink" type="submit"><span data-c="wall.submit"></span></button>
              <p class="wall__status" data-wall-status role="status" aria-live="polite"></p>
            </div>
          </form>
          <div class="wall__list-wrap">
            <p class="wall__meta" data-wall-meta></p>
            <ol class="wall__list" data-wall-list aria-label="公开的祝福"></ol>
            <div class="wall__state" data-wall-state></div>
            <button class="btn btn--ghost wall__more" type="button" data-wall-more hidden><span data-c="wall.more"></span></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 珍藏（私密） ============ -->
    <section class="act private" id="private" data-act="private" aria-labelledby="private-title" data-feature="privateArea">
      <p class="act__mark" aria-hidden="true"><span data-act-no></span><b data-c="acts.private"></b></p>
      <div class="act__body">
        <div class="gate" data-gate>
          <div class="gate__folder paper" data-reveal>
            <div class="gate__seal" aria-hidden="true"><span data-c="recipient.sealLetter"></span></div>
            <h2 id="private-title" data-c="private.title"></h2>
            <p class="gate__text" data-c="private.text"></p>
            <form class="gate__form gate__form--login" data-gate-form novalidate>
              <label class="sr-only" for="gate-username">用户名</label>
              <div class="gate__input">
                <input id="gate-username" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required data-ph="private.usernamePlaceholder">
              </div>
              <label class="sr-only" for="gate-password">密码</label>
              <div class="gate__input">
                <input id="gate-password" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required data-ph="private.passwordPlaceholder">
                <button class="gate__eye" type="button" data-gate-eye aria-label="显示密码" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
                </button>
              </div>
              <button class="btn btn--ink" type="submit"><span data-c="private.button"></span></button>
            </form>
            <p class="gate__status" data-gate-status role="status" aria-live="polite"></p>
            <p class="gate__hint" data-c="private.hint"></p>
          </div>
        </div>
        <div class="vault" data-vault hidden></div>
      </div>
    </section>

    <!-- ============ 片尾 ============ -->
    <footer class="ending" id="ending" data-act="ending">
      <p class="ending__script script" data-reveal>Happy Birthday</p>
      <p class="ending__line" data-reveal data-c="footer.line"></p>
      <p class="ending__sub" data-reveal data-c="footer.sub"></p>
      <button class="btn btn--ghost" type="button" data-replay><span data-c="footer.replay"></span></button>
      <ul class="ending__credits" data-credits hidden></ul>
    </footer>
  </main>

  <!-- 声音控制 -->
  <div class="sound" data-sound hidden>
    <button class="sound__btn" type="button" data-sound-toggle aria-label="播放背景音乐">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5L8 5.5Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      <span class="sound__bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <button class="sound__btn" type="button" data-sound-mute aria-label="静音" aria-pressed="false">
      <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w" d="m16 9.5 5 5m0-5-5 5"/></svg>
    </button>
    <label class="sound__vol">
      <span class="sr-only">音量</span>
      <input type="range" min="0" max="100" step="1" value="100" data-sound-volume>
    </label>
    <span class="sound__note" data-sound-note role="status"></span>
  </div>

  <div class="toast" data-toast role="status" aria-live="polite" hidden></div>

  <noscript><p class="noscript">这个页面需要开启 JavaScript 才能正常显示。</p></noscript>
</body>
</html>
