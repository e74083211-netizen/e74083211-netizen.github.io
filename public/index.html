<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#120d0a">
  <meta name="color-scheme" content="dark">
  <title>生日快乐</title>
  <meta name="description" content="一份生日礼物">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/site.config.js"></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body class="is-locked">
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="scroll-progress" aria-hidden="true"><span></span></div>
  <canvas class="dust" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- ============ 开场邀请 ============ -->
  <div class="opening" id="opening" role="dialog" aria-modal="true" aria-labelledby="opening-to">
    <div class="opening__inner">
      <p class="opening__to script" id="opening-to" data-c="opening.to"></p>
      <p class="opening__line" data-c="opening.line"></p>

      <div class="envelope" aria-hidden="true">
        <div class="envelope__back"></div>
        <div class="envelope__card">
          <p class="envelope__card-title" data-c="opening.cardTitle"></p>
          <p class="envelope__card-date" data-date></p>
          <p class="envelope__card-note" data-c="opening.cardNote"></p>
        </div>
        <div class="envelope__front"></div>
        <div class="envelope__flap"></div>
        <div class="envelope__seal"><span data-c="recipient.sealLetter"></span></div>
      </div>

      <div class="opening__actions">
        <button class="btn btn--primary" type="button" data-enter="sound">
          <span data-c="opening.enterWithSound"></span>
        </button>
        <button class="btn btn--ghost" type="button" data-enter="quiet">
          <span data-c="opening.enterQuiet"></span>
        </button>
      </div>
    </div>
  </div>

  <main id="main">
    <!-- ============ 首屏 ============ -->
    <section class="hero" id="hero" aria-labelledby="hero-name">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__image"></div>
        <div class="hero__glow hero__glow--a"></div>
        <div class="hero__glow hero__glow--b"></div>
      </div>
      <div class="hero__content">
        <p class="hero__date" data-date></p>
        <p class="hero__script script" data-c="hero.script"></p>
        <h1 class="hero__name" id="hero-name" tabindex="-1"><span data-name></span></h1>
        <p class="hero__lead" data-c="hero.lead"></p>
        <p class="hero__count chip" data-countdown></p>
      </div>
      <a class="hero__scroll" href="#wishes"><span data-c="hero.scrollHint"></span><i aria-hidden="true"></i></a>
    </section>

    <!-- ============ 祝愿 ============ -->
    <section class="section wishes" id="wishes" aria-labelledby="wishes-title">
      <header class="section__head" data-reveal>
        <p class="eyebrow" data-c="wishes.eyebrow"></p>
        <h2 id="wishes-title" data-c="wishes.title"></h2>
        <p class="section__sub" data-c="wishes.subtitle"></p>
      </header>
      <div class="wishes__grid" data-wishes></div>
      <p class="wishes__quote" data-reveal data-c="wishes.quote"></p>
    </section>

    <!-- ============ 蛋糕 ============ -->
    <section class="section cake" id="cake" aria-labelledby="cake-title">
      <header class="section__head" data-reveal>
        <p class="eyebrow" data-c="cake.eyebrow"></p>
        <h2 id="cake-title" data-c="cake.title"></h2>
        <p class="section__sub" data-c="cake.subtitle"></p>
      </header>
      <div class="cake__stage" data-reveal>
        <div class="cake__light" aria-hidden="true"></div>
        <div class="cake__svg" data-cake-svg></div>
      </div>
      <div class="cake__panel" data-reveal>
        <p class="cake__step" data-cake-step aria-live="polite"></p>
        <div class="cake__mic" data-cake-mic hidden>
          <span class="cake__meter"><i></i></span>
        </div>
        <div class="cake__actions">
          <button class="btn btn--primary" type="button" data-cake-primary></button>
          <button class="btn btn--ghost" type="button" data-cake-mic-btn hidden></button>
        </div>
        <p class="cake__hint" data-cake-hint></p>
      </div>
      <div class="cake__reveal paper" data-cake-reveal hidden tabindex="-1">
        <p class="script cake__reveal-mark">for you</p>
        <h3 data-c="cake.reveal.title"></h3>
        <p class="cake__reveal-text" data-c="cake.reveal.text"></p>
        <button class="btn btn--text" type="button" data-cake-again><span data-c="cake.reveal.again"></span></button>
      </div>
    </section>

    <!-- ============ 留言墙 ============ -->
    <section class="section wall" id="wall" aria-labelledby="wall-title" data-feature="wishesWall">
      <header class="section__head" data-reveal>
        <p class="eyebrow" data-c="wall.eyebrow"></p>
        <h2 id="wall-title" data-c="wall.title"></h2>
        <p class="section__sub" data-c="wall.subtitle"></p>
      </header>
      <div class="wall__layout">
        <form class="wall__form card" data-wall-form novalidate data-reveal>
          <p class="wall__notice">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5c4.6 0 8.3 3.3 9.5 7.5-1.2 4.2-4.9 7.5-9.5 7.5S3.7 16.2 2.5 12C3.7 7.8 7.4 4.5 12 4.5Zm0 4a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
            <span data-c="wall.notice"></span>
          </p>
          <label class="field">
            <span class="field__label">昵称</span>
            <input name="nickname" type="text" maxlength="20" autocomplete="nickname" required data-ph="wall.nicknamePlaceholder">
          </label>
          <label class="field">
            <span class="field__label">祝福 <em class="field__count" data-count>0 / 300</em></span>
            <textarea name="content" rows="4" maxlength="300" required data-ph="wall.contentPlaceholder"></textarea>
          </label>
          <label class="hp" aria-hidden="true">网站 <input name="website" type="text" tabindex="-1" autocomplete="off"></label>
          <div class="wall__submit">
            <button class="btn btn--primary" type="submit"><span data-c="wall.submit"></span></button>
            <p class="wall__status" data-wall-status role="status" aria-live="polite"></p>
          </div>
        </form>
        <div class="wall__list-wrap">
          <p class="wall__meta" data-wall-meta></p>
          <ol class="wall__list" data-wall-list aria-label="公开的祝福"></ol>
          <div class="wall__state" data-wall-state></div>
          <button class="btn btn--ghost wall__more" type="button" data-wall-more hidden>看更多祝福</button>
        </div>
      </div>
    </section>

    <!-- ============ 私密区域 ============ -->
    <section class="section private" id="private" aria-labelledby="private-title" data-feature="privateArea">
      <div class="gate" data-gate>
        <div class="gate__card card" data-reveal>
          <div class="gate__lock" aria-hidden="true">
            <svg viewBox="0 0 48 48"><rect x="10" y="21" width="28" height="20" rx="5"/><path d="M16 21v-5a8 8 0 0 1 16 0v5"/><circle cx="24" cy="30" r="2.4"/><path d="M24 32v4"/></svg>
          </div>
          <p class="eyebrow" data-c="private.eyebrow"></p>
          <h2 id="private-title" data-c="private.title"></h2>
          <p class="gate__text" data-c="private.text"></p>
          <form class="gate__form" data-gate-form novalidate>
            <label class="sr-only" for="gate-password">口令</label>
            <input id="gate-password" name="password" type="password" autocomplete="current-password" required data-ph="private.placeholder">
            <button class="btn btn--primary" type="submit"><span data-c="private.button"></span></button>
          </form>
          <p class="gate__status" data-gate-status role="status" aria-live="polite"></p>
          <p class="gate__hint" data-c="private.hint"></p>
        </div>
      </div>
      <div class="vault" data-vault hidden></div>
    </section>

    <footer class="footer">
      <p class="footer__line" data-c="footer.line"></p>
      <p class="footer__sub" data-c="footer.sub"></p>
      <button class="btn btn--text" type="button" data-replay><span data-c="footer.replay"></span></button>
    </footer>
  </main>

  <!-- 声音控制 -->
  <div class="sound" data-sound hidden>
    <button class="sound__btn" type="button" data-sound-toggle aria-label="播放背景音乐">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5L8 5.5Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      <span class="sound__bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <button class="sound__btn" type="button" data-sound-mute aria-label="静音" aria-pressed="false">
      <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w" d="m16 9.5 5 5m0-5-5 5"/></svg>
    </button>
    <span class="sound__note" data-sound-note></span>
  </div>

  <div class="toast" data-toast role="status" aria-live="polite" hidden></div>

  <noscript><p class="noscript">这个页面需要开启 JavaScript 才能正常显示。</p></noscript>
</body>
</html>
